<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السلم والحية: الأصوات المنطقية</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --cell-bg: rgba(30, 41, 59, 0.7);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            transition: background 1s ease;
        }

        .level-1 { background: linear-gradient(to bottom, #1a2e1a, #0f172a); }
        .level-2 { background: linear-gradient(to bottom, #450a0a, #0f172a); }
        .level-3 { background: linear-gradient(to bottom, #1e1b4b, #0f172a); }

        .header { margin: 20px; text-align: center; }
        #level-indicator { background: #f1c40f; color: black; padding: 5px 15px; border-radius: 20px; font-weight: bold; }

        #board {
            position: relative;
            width: 450px;
            height: 450px;
            background: var(--cell-bg);
            border: 5px solid #334155;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .cell {
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            position: relative;
        }

        .cell.ladder::before { content: '🪜'; font-size: 20px; }
        .cell.snake::before { content: '🐍'; font-size: 20px; }
        .cell.fire::before { content: '🔥'; font-size: 18px; }

        .player {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            position: absolute;
            z-index: 10;
            transition: all 0.4s ease;
            border: 2px solid white;
        }

        #p1 { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
        #p2 { background: #10b981; box-shadow: 0 0 10px #10b981; }

        .controls {
            margin-top: 20px;
            background: rgba(30, 41, 59, 0.9);
            padding: 15px;
            border-radius: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        button {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:disabled { background: #475569; }
        .dice-box { font-size: 30px; background: white; color: black; padding: 5px 15px; border-radius: 10px; }
    </style>
</head>
<body class="level-1">

    <div class="header">
        <h1>🎮 سلم وحية: <span id="level-name">تحميل...</span></h1>
        <span id="level-indicator">المرحلة 1</span>
        <div id="msg" style="margin-top: 10px; color: #f1c40f;">دورك الآن!</div>
    </div>

    <div id="board">
        <div id="p1" class="player"></div>
        <div id="p2" class="player"></div>
    </div>

    <div class="controls">
        <div class="dice-box" id="dice">🎲</div>
        <button id="btn" onclick="play()">ارمي النرد</button>
    </div>

    <!-- مكتبة الأصوات المنطقية -->
    <!-- صوت نرد حقيقي -->
    <audio id="snd-dice" src="https://www.soundjay.com/misc/sounds/dice-roll-1.mp3"></audio>
    <!-- صوت صعود خشبي منطقي -->
    <audio id="snd-ladder" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3"></audio>
    <!-- صوت انزلاق (حية) -->
    <audio id="snd-snake" src="https://assets.mixkit.co/active_storage/sfx/2021/2021-preview.mp3"></audio>
    <!-- صوت احتراق (نار) -->
    <audio id="snd-fire" src="https://assets.mixkit.co/active_storage/sfx/2704/2704-preview.mp3"></audio>
    <!-- صوت نجاح (فوز) -->
    <audio id="snd-win" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-preview.mp3"></audio>
    <!-- صوت خسارة منطقي -->
    <audio id="snd-lose" src="https://www.soundjay.com/misc/sounds/fail-trombone-01.mp3"></audio>

<script>
    let currentLevel = 1;
    let p1Pos = 1;
    let p2Pos = 1;
    let isWorking = false;

    const levels = {
        1: { name: "الغابة الخضراء", class: "level-1", snakes: {25:5, 44:22, 98:70}, ladders: {4:20, 15:35, 50:80, 70:90}, fire: [] },
        2: { name: "وادي البراكين", class: "level-2", snakes: {30:10, 55:20, 75:40, 99:5}, ladders: {5:15, 40:60}, fire: [12, 45, 82] },
        3: { name: "ثقب الفضاء", class: "level-3", snakes: {20:2, 40:5, 60:10, 80:15, 95:20}, ladders: {2:50}, fire: [33, 66, 88] }
    };

    function playSound(id) {
        const audio = document.getElementById(id);
        if (audio) {
            audio.currentTime = 0;
            audio.play().catch(e => console.log("الصوت بانتظار ضغطة زر لبدء العمل"));
        }
    }

    function initBoard() {
        const board = document.getElementById('board');
        const config = levels[currentLevel];
        
        // إعادة بناء الخلايا
        board.innerHTML = '<div id="p1" class="player"></div><div id="p2" class="player"></div>';
        
        document.body.className = config.class;
        document.getElementById('level-name').innerText = config.name;
        document.getElementById('level-indicator').innerText = "المرحلة " + currentLevel;

        for (let i = 100; i >= 1; i--) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = 'c' + i;
            cell.innerText = i;
            if (config.ladders[i]) cell.classList.add('ladder');
            if (config.snakes[i]) cell.classList.add('snake');
            if (config.fire.includes(i)) cell.classList.add('fire');
            board.appendChild(cell);
        }
        updatePos();
    }

    function updatePos() {
        const c1 = document.getElementById('c' + p1Pos);
        const c2 = document.getElementById('c' + p2Pos);
        if (c1 && c2) {
            document.getElementById('p1').style.top = c1.offsetTop + 5 + 'px';
            document.getElementById('p1').style.left = c1.offsetLeft + 5 + 'px';
            document.getElementById('p2').style.top = c2.offsetTop + 5 + 'px';
            document.getElementById('p2').style.left = c2.offsetLeft + 15 + 'px';
        }
    }

    async function move(id, steps) {
        playSound('snd-dice');
        for (let i = 0; i < steps; i++) {
            if (id === 1 && p1Pos < 100) p1Pos++;
            else if (id === 2 && p2Pos < 100) p2Pos++;
            updatePos();
            await new Promise(r => setTimeout(r, 250));
        }
        
        let pos = id === 1 ? p1Pos : p2Pos;
        const config = levels[currentLevel];

        if (config.ladders[pos]) {
            playSound('snd-ladder');
            pos = config.ladders[pos];
            document.getElementById('msg').innerText = "🚀 صعود ممتاز!";
        } else if (config.snakes[pos]) {
            playSound('snd-snake');
            pos = config.snakes[pos];
            document.getElementById('msg').innerText = "🐍 انزلاق لأسفل!";
        } else if (config.fire.includes(pos)) {
            playSound('snd-fire');
            pos = Math.max(1, pos - 5);
            document.getElementById('msg').innerText = "🔥 احذر! تراجعت للخلف";
        }

        if (id === 1) p1Pos = pos; else p2Pos = pos;
        updatePos();
    }

    async function play() {
        if (isWorking) return;
        isWorking = true;
        document.getElementById('btn').disabled = true;

        let roll = Math.floor(Math.random() * 6) + 1;
        document.getElementById('dice').innerText = roll;
        await move(1, roll);

        if (p1Pos >= 100) {
            playSound('snd-win');
            setTimeout(() => {
                alert("مبروك! فزت في المرحلة " + currentLevel);
                if (currentLevel < 3) {
                    currentLevel++;
                    p1Pos = 1; p2Pos = 1;
                    initBoard();
                } else {
                    alert("أنت بطل اللعبة النهائي! 🎉");
                    location.reload();
                }
            }, 500);
            isWorking = false;
            document.getElementById('btn').disabled = false;
            return;
        }

        document.getElementById('msg').innerText = "الكمبيوتر يتحرك...";
        await new Promise(r => setTimeout(r, 1000));
        let cpuRoll = Math.floor(Math.random() * 6) + 1;
        document.getElementById('dice').innerText = cpuRoll;
        await move(2, cpuRoll);

        if (p2Pos >= 100) {
            playSound('snd-lose');
            setTimeout(() => {
                alert("للأسف، فاز الكمبيوتر.");
                p1Pos = 1; p2Pos = 1;
                initBoard();
            }, 500);
        }

        document.getElementById('msg').innerText = "دورك الآن!";
        isWorking = false;
        document.getElementById('btn').disabled = false;
    }

    window.onload = initBoard;
</script>
</body>
</html>
